<!doctype html>
<!--
  Music surface (U3): the WebView loads this page and messages it the ABC string.
  It will host abcjs to render notation (SVG) and play audio via the synth,
  posting ready/played/error/tap events back to React Native.
  U1 ships this as a placeholder skeleton; U3 wires up abcjs + the bridge.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <style>
      html, body { margin: 0; padding: 0; background: transparent; }
      #paper { width: 100%; }
    </style>
  </head>
  <body>
    <div id="paper"></div>
    <script>
      // Placeholder: acknowledge the bridge exists so U3 can build on it.
      function post(msg) {
        if (window.ReactNativeWebView) {
          window.ReactNativeWebView.postMessage(JSON.stringify(msg));
        }
      }
      post({ type: 'ready', placeholder: true });
    </script>
  </body>
</html>
