<!-- @dsCard group="Components" viewport="700x230" subtitle="AnswerOption states · Button variants · PlayButton · StrandChip" name="Core components" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--surface);display:flex;align-items:center;justify-content:center;height:230px;gap:20px;font-family:var(--font-ui);color:var(--text)}</style></head><body>
<div style="display:flex;flex-direction:column;gap:7px;width:240px;">
  <div style="display:flex;align-items:center;gap:11px;padding:10px 12px;background:#1a1d24;border:1.5px solid #262b34;border-radius:13px;"><span style="width:24px;height:24px;border-radius:50%;border:1.5px solid #3a4150;display:flex;align-items:center;justify-content:center;font:500 11px var(--font-mono);color:#969ba7;">A</span><span style="font-size:14px;font-weight:600;">default</span></div>
  <div style="display:flex;align-items:center;gap:11px;padding:10px 12px;background:rgba(240,169,79,0.12);border:1.5px solid #f0a94f;border-radius:13px;"><span style="width:24px;height:24px;border-radius:50%;background:#f0a94f;display:flex;align-items:center;justify-content:center;font:700 11px var(--font-mono);color:#3a2a10;">B</span><span style="font-size:14px;font-weight:700;color:#f6e0c2;">selected</span></div>
  <div style="display:flex;align-items:center;gap:11px;padding:10px 12px;background:rgba(87,207,135,0.12);border:1.5px solid #57cf87;border-radius:13px;"><span style="width:24px;height:24px;border-radius:50%;background:#57cf87;display:flex;align-items:center;justify-content:center;color:#08351d;font-weight:700;font-size:12px;">✓</span><span style="font-size:14px;font-weight:700;color:#c9f2d9;">correct</span></div>
  <div style="display:flex;align-items:center;gap:11px;padding:10px 12px;background:rgba(240,102,111,0.12);border:1.5px solid #f0666f;border-radius:13px;"><span style="width:24px;height:24px;border-radius:50%;background:#f0666f;display:flex;align-items:center;justify-content:center;color:#3a0d10;font-weight:700;font-size:12px;">×</span><span style="font-size:14px;font-weight:700;color:#f6cdcf;">incorrect</span><span style="margin-left:auto;font:500 9px var(--font-mono);color:#f0949b;">your pick</span></div>
</div>
<div style="display:flex;flex-direction:column;gap:9px;width:170px;">
  <div style="text-align:center;background:#f0a94f;color:#3a2a10;font-weight:700;font-size:14px;padding:11px;border-radius:13px;">Check</div>
  <div style="text-align:center;background:#f3f4f6;color:#0b0c0f;font-weight:700;font-size:14px;padding:11px;border-radius:13px;">Continue</div>
  <div style="text-align:center;color:#969ba7;font-weight:600;font-size:13px;padding:4px;">Review 2 mistakes</div>
  <div style="text-align:center;background:#23201a;color:#f2efe8;font-family:var(--font-exam);font-weight:700;font-size:14px;padding:11px;border-radius:13px;">Begin exam</div>
</div>
<div style="display:flex;flex-direction:column;gap:14px;align-items:flex-start;">
  <div style="display:flex;gap:10px;align-items:center;"><span style="width:34px;height:34px;border-radius:50%;background:rgba(139,142,242,0.14);border:1.5px solid #8b8ef2;display:flex;align-items:center;justify-content:center;"><svg width="10" height="11" viewBox="0 0 10 11"><polygon points="0,0 10,5.5 0,11" fill="#8b8ef2"/></svg></span><span style="width:34px;height:34px;border-radius:50%;background:#1a1a1a;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,0.3);"><svg width="10" height="11" viewBox="0 0 10 11"><polygon points="0,0 10,5.5 0,11" fill="#f6f4ee"/></svg></span><span style="font:500 9px var(--font-mono);color:#6b7280;">PlayButton · tinted / on-paper</span></div>
  <div style="display:flex;flex-direction:column;gap:7px;">
    <span style="display:flex;align-items:center;gap:7px;"><span style="width:8px;height:8px;border-radius:3px;background:#f0a94f;"></span><span style="font:500 10px var(--font-mono);letter-spacing:0.12em;color:#f0c489;">PITCH &amp; NOTATION</span></span>
    <span style="display:flex;align-items:center;gap:7px;"><span style="width:8px;height:8px;border-radius:3px;background:#f0666f;"></span><span style="font:500 10px var(--font-mono);letter-spacing:0.12em;color:#f0949b;">RHYTHM &amp; METRE</span><span style="font-family:var(--font-music);font-size:12px;color:#f0949b;">&#119135;</span></span>
  </div>
</div>
</body></html>
