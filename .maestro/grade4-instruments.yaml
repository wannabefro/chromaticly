# fyu.12 — Grade 4 instruments (text-only knowledge). Seed ?seed=instruments-4
# (families, clefs used, playing directions). Reaching unit-row-instruments-4
# proves the grade-4 chain extends through the instruments lesson; the exercise is
# a verbal question (design 10c: no paper card, no play — the stimulus zone
# collapses) with either a text MCQ or a term↔meaning drag-match (design 5f).
# Runs once at U13, once Level 4 is reachable (level4() real) — see the fyu.13
# notes on on-device gate consolidation.
appId: host.exp.Exponent
---
- clearState
- openLink: ${DEV_URL}/--/?seed=instruments-4

- extendedWaitUntil:
    visible: { text: "Continue" }
    timeout: 40000
    optional: true
- tapOn: { text: "Continue", optional: true }
- tapOn: { point: "90%,48%" }

- extendedWaitUntil:
    visible: { id: "level-map-screen" }
    timeout: 90000

- scrollUntilVisible:
    element: { id: "unit-row-instruments-4" }
    direction: DOWN
    visibilityPercentage: 20
    centerElement: true
    waitToSettleTimeoutMs: 500
    timeout: 45000
- tapOn: { id: "unit-row-instruments-4" }

- extendedWaitUntil:
    visible: { id: "teach-phase" }
    timeout: 20000
- takeScreenshot: g4-instruments-teach
- tapOn: { id: "teach-start" }

# Text-only question: the prompt carries it, no stimulus-music card is shown.
- extendedWaitUntil:
    visible: { id: "prompt" }
    timeout: 20000
- assertVisible: { id: "prompt" }
- assertNotVisible: { id: "stimulus-music" }
- takeScreenshot: g4-instruments-exercise
