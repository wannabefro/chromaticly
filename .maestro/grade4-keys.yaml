# fyu.6 — Grade 4 keys/scales content. Seeds ?seed=minor-scales-4 (the new
# harmonic+melodic minor lesson in B♭ minor and G♯ minor). Its point is the
# on-device proof jest can't give: that the notation surface RENDERS a
# DOUBLE-SHARP. G♯ harmonic minor's raised 7th is F double-sharp (F𝄪, emitted
# as abc `^^F`), the course's first double-sharp — the engine spells it F##5
# (proven in jest), but only a device screenshot confirms abcjs draws the 𝄪
# glyph on the paper card. Reaching unit-row-minor-scales-4 at all is itself
# proof the grade-4 doc loaded and the chain/unlock wiring is correct (a real
# learner selecting Grade 4 lands here — no dev seam beyond the ?seed onboarding
# fast-forward every flow uses).
appId: host.exp.Exponent
---
- clearState
- openLink: ${DEV_URL}/--/?seed=minor-scales-4

- runFlow: _dev-menu.yaml

- extendedWaitUntil:
    visible: { id: "lane-screen" }
    timeout: 90000

- scrollUntilVisible:
    element: { id: "unit-row-minor-scales-4" }
    direction: DOWN
    visibilityPercentage: 20
    centerElement: true
    waitToSettleTimeoutMs: 500
    timeout: 20000
- tapOn: { id: "unit-row-minor-scales-4" }

# The teach card's worked example is seeded to a G♯ harmonic minor scale, so the
# F𝄪 double-sharp is on screen here for a human eye (design's teach phase).
- extendedWaitUntil:
    visible: { id: "teach-phase" }
    timeout: 20000
- takeScreenshot: g4-minor-scales-teach
- tapOn: { id: "teach-start" }

# The exercise notation (abcjs paper card) renders — the scale-construction
# "spot the wrong note" stave. Proves grade-4 scale notation renders on device.
- extendedWaitUntil:
    visible: { id: "stimulus-music" }
    timeout: 20000
- assertVisible: { id: "stimulus-music" }
- takeScreenshot: g4-minor-scales-exercise
