# chromaticly-gni — Grade 4 breve rest (the rests-arc capstone). Seed ?seed=rests-4
# fast-forwards to the lesson (rhythm-breve-4 -> rests-4 -> rhythm-doubledot-4).
# The breve rest renders in a big bar (9/4 or 12/4).
#   maestro test -e DEV_URL=exp://127.0.0.1:8092 .maestro/grade4-rests.yaml
appId: host.exp.Exponent
---
- clearState
- openLink: ${DEV_URL}/--/?seed=rests-4

- extendedWaitUntil:
    visible: { text: "Continue" }
    timeout: 40000
    optional: true
- tapOn: { text: "Continue", optional: true }

- extendedWaitUntil:
    visible: { id: "lane-screen" }
    timeout: 90000

- scrollUntilVisible:
    element: { id: "unit-row-rests-4" }
    direction: DOWN
    visibilityPercentage: 20
    centerElement: true
    waitToSettleTimeoutMs: 500
    timeout: 45000
- tapOn: { id: "unit-row-rests-4" }

- extendedWaitUntil:
    visible: { id: "teach-phase" }
    timeout: 20000
- takeScreenshot: g4-rests-teach
- tapOn: { id: "teach-start" }

- extendedWaitUntil:
    visible: { id: "prompt" }
    timeout: 20000
- assertVisible: { id: "prompt" }
- assertVisible: { id: "stimulus-music" }
- assertVisible: { id: "option-0" }
- takeScreenshot: g4-rests-exercise
