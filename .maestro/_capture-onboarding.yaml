# Screenshot the whole first-run journey, one frame per screen. Same path as
# onboarding-first-set.yaml, which asserts; this one looks. Keep the two in step.
#   maestro test -e DEV_URL=exp://127.0.0.1:48090 -e OUT=<dir> .maestro/_capture-onboarding.yaml
appId: host.exp.Exponent
---
- clearState
- openLink: ${DEV_URL}
- tapOn:
    text: "Open"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
# clearState wipes Expo Go's first-launch flag, so it opens its developer menu
# over the app. Its X carries the accessibility label "Close".
- tapOn:
    text: "Close"
    optional: true
- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 60000
- takeScreenshot: ${OUT}/01-welcome

- tapOn:
    id: "start-learning"
- assertVisible:
    id: "placement-intro"
- takeScreenshot: ${OUT}/02-placement-intro

- tapOn:
    id: "placement-start"
- assertVisible:
    id: "placement-item"
- takeScreenshot: ${OUT}/02b-placement-item

- repeat:
    while:
      visible: { id: "placement-item" }
    commands:
      - tapOn: { id: "option-0", optional: true }
      # The context item's bar strip sits below the passage card, off-screen on a
      # phone. It is a native Pressable, not part of the abcjs WebView, so it is
      # tappable — but only once scrolled to.
      - scrollUntilVisible:
          element: { id: "bar-1" }
          direction: DOWN
          visibilityPercentage: 60
          timeout: 4000
          optional: true
      - tapOn: { id: "bar-1", optional: true }
      - tapOn: { id: "roman-numeral-I", optional: true }
      - tapOn: { id: "check", optional: true }
      - tapOn: { id: "feedback-sheet-continue", optional: true }

- extendedWaitUntil:
    visible:
      id: "placement-result"
    timeout: 15000
- takeScreenshot: ${OUT}/02c-placement-result

- tapOn:
    id: "placement-accept"
- assertVisible:
    id: "plan-screen"
- takeScreenshot: ${OUT}/03-plan

- tapOn:
    id: "plan-start-warmup"
- assertVisible:
    id: "warm-up-screen"

# The three coached questions, answered by LABEL rather than by index.
# `warmUpFor` owns the seeds, and a seed change reshuffles the options — the
# old `option-0 / option-1 / option-1` comment was already wrong when the
# warm-up atom moved to `add_time_signature` (chromaticly-atz), and
# retry-until-correct turned that into a silent stall on question 3 of 3.
- takeScreenshot: ${OUT}/04-warmup-question

# Correct indices for note_value_compare seeds 0..2 are 0, 1, 1.
- tapOn:
    text: "3/4"
- takeScreenshot: ${OUT}/05-warmup-answered
- tapOn:
    id: "check"
- takeScreenshot: ${OUT}/06-warmup-feedback
- tapOn:
    id: "feedback-sheet-continue"

- tapOn:
    text: "2/4"
- tapOn:
    id: "check"
- tapOn:
    id: "feedback-sheet-continue"

- tapOn:
    text: "4/4"
- tapOn:
    id: "check"
- tapOn:
    id: "feedback-sheet-continue"

- extendedWaitUntil:
    visible:
      id: "landed-screen"
    timeout: 15000
- takeScreenshot: ${OUT}/07-landed

- tapOn:
    id: "landed-continue"
- extendedWaitUntil:
    visible:
      id: "lanes-screen"
    timeout: 15000
- takeScreenshot: ${OUT}/08-lanes

- tapOn:
    id: "lane-row-pitch"
- extendedWaitUntil:
    visible:
      id: "lane-screen"
    timeout: 15000
- takeScreenshot: ${OUT}/09-lane-pitch
