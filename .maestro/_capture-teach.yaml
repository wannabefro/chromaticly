# Screenshots the whole teach phase, including the worked example below the fold.
# Two notation surfaces share this screen; see chromaticly-rlk.
appId: host.exp.Exponent
---
- extendedWaitUntil:
    visible: { text: "Continue" }
    timeout: 30000
    optional: true
- tapOn: { text: "Continue", optional: true }

- extendedWaitUntil:
    visible: { id: "lane-screen" }
    timeout: 60000
    optional: true
- tapOn: { text: "Continue", optional: true }
- tapOn: { id: "set-close", optional: true }
- tapOn: { id: "teach-close", optional: true }
- extendedWaitUntil:
    visible: { id: "lane-screen" }
    timeout: 60000

# The picker TOGGLES, and the blind dev-overlay tap above can already have
# opened it, so tapping unconditionally closed it again (chromaticly-58e).
- runFlow:
    when:
      notVisible: { id: "lane-grade-option-${GRADE}" }
    commands:
      - tapOn: { id: "lane-other-grades", optional: true }
- extendedWaitUntil:
    visible: { id: "lane-grade-option-${GRADE}" }
    timeout: 10000
    optional: true
- tapOn: { id: "lane-grade-option-${GRADE}", optional: true }
- scrollUntilVisible:
    element: { id: "unit-row-${LESSON}" }
    direction: DOWN
    visibilityPercentage: 20
    centerElement: true
    waitToSettleTimeoutMs: 500
    timeout: 45000
- tapOn: { id: "unit-row-${LESSON}" }

- extendedWaitUntil:
    visible: { id: "teach-phase" }
    timeout: 20000
- extendedWaitUntil: { visible: { id: "__settle_never__" }, timeout: 5000, optional: true }
- takeScreenshot: ${OUT}/${LESSON}-teach-top
- scrollUntilVisible:
    element: { id: "teach-worked-example" }
    direction: DOWN
    visibilityPercentage: 20
    centerElement: true
    waitToSettleTimeoutMs: 500
    timeout: 20000
    optional: true
- extendedWaitUntil: { visible: { id: "__settle_never__" }, timeout: 4000, optional: true }
- takeScreenshot: ${OUT}/${LESSON}-teach-worked
