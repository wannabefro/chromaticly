# chromaticly-gni — Grade 3 smaller rests (demisemiquaver added). Seed ?seed=rests-3
# fast-forwards to the lesson (compound-bars-3 -> rests-3 -> intervals-3).
#   maestro test -e DEV_URL=exp://127.0.0.1:8092 .maestro/grade3-rests.yaml
appId: host.exp.Exponent
---
- clearState
- openLink: ${DEV_URL}/--/?seed=rests-3

- extendedWaitUntil:
    visible: { text: "Continue" }
    timeout: 40000
    optional: true
- tapOn: { text: "Continue", optional: true }
- tapOn: { point: "90%,48%" }

- extendedWaitUntil:
    visible: { id: "lane-screen" }
    timeout: 90000

- scrollUntilVisible:
    element: { id: "unit-row-rests-3" }
    direction: DOWN
    visibilityPercentage: 20
    centerElement: true
    waitToSettleTimeoutMs: 500
    timeout: 45000
- tapOn: { id: "unit-row-rests-3" }

- extendedWaitUntil:
    visible: { id: "teach-phase" }
    timeout: 20000
- takeScreenshot: g3-rests-teach
- tapOn: { id: "teach-start" }

- extendedWaitUntil:
    visible: { id: "prompt" }
    timeout: 20000
- assertVisible: { id: "prompt" }
- assertVisible: { id: "stimulus-music" }
- assertVisible: { id: "option-0" }
- takeScreenshot: g3-rests-exercise
