# 302.2 + 302.24 — the practice exam under exam conditions (design 3b/3c/3d).
# `?seed=exam` masters every unit so the Level 1 exam gate is unlocked.
#
# Proves the register shift and the exam apparatus on a real device: the running
# clock, the answered-marks counter (which must never show a score), the section
# navigator, and flag → review-before-submit. Also asserts the never-violate rule
# 4 negatives — no hint, no streak, no per-item feedback sheet anywhere in a paper.
appId: host.exp.Exponent
---
- clearState
- openLink: exp://127.0.0.1:8090/--/?seed=exam

- extendedWaitUntil:
    visible: { text: "Continue" }
    timeout: 40000
    optional: true
- tapOn: { text: "Continue", optional: true }
- tapOn: { point: "90%,48%" }

# G6 U7: the exam gate no longer sits at the bottom of a scroll on the Learn tab
# — the Learn tab is seven lanes now, and a paper belongs to no single lane. The
# Exams tab is the one route to it. `?seed=exam` names no lesson, so the shell
# opens on the lane LIST rather than a lane.
- extendedWaitUntil:
    visible: { id: "app-shell" }
    timeout: 90000
- assertVisible: { id: "lanes-screen" }
- tapOn: { id: "tab-exams" }
- extendedWaitUntil:
    visible: { id: "exams-screen" }
    timeout: 20000
- tapOn: { id: "exam-gate-level-1" }

# 3b — start. The paper states its own terms: minutes, marks, sections.
- extendedWaitUntil:
    visible: { id: "exam-start" }
    timeout: 20000
- assertVisible: { text: "MINUTES" }
- assertVisible: { text: "MARKS" }
- assertVisible: { text: "SECTIONS" }
- takeScreenshot: exam-start
- tapOn: { id: "exam-begin" }

# 3c — in progress. Clock, counter and navigator are all live.
- extendedWaitUntil:
    visible: { id: "exam-paper" }
    timeout: 20000
- assertVisible: { id: "exam-timer" }
- assertVisible: { id: "exam-marks" }
- assertVisible: { id: "exam-navigator" }
- assertNotVisible: { id: "hint" }
- assertNotVisible: { id: "feedback-sheet" }
- takeScreenshot: exam-in-progress

# Flag the first question — it must come back to us before the paper is submitted.
- tapOn: { id: "exam-flag" }
- assertVisible: { text: "⚑ flagged" }

# Answer all 20 questions. Correctness doesn't matter here; reaching the end does.
- repeat:
    times: 20
    commands:
      - tapOn: { id: "exam-option-0" }
      - assertNotVisible: { id: "feedback-sheet" } # silent paper: never any feedback
      - tapOn: { id: "exam-next" }

# The flag routed us to review (8a) rather than straight to the result. Review shows
# what still needs attention — and never a hint of how the learner did.
- extendedWaitUntil:
    visible: { id: "exam-review" }
    timeout: 15000
- assertVisible: { id: "exam-timer" } # the clock keeps running while you review
- assertNotVisible: { text: "Correct" }
- takeScreenshot: exam-review
- tapOn: { id: "exam-review-flagged" }

# Review lands back on the flagged question, still flagged, clock still running.
- assertVisible: { id: "exam-paper" }
- assertVisible: { text: "⚑ flagged" }
- assertVisible: { id: "exam-timer" }

# Walk to the end again and submit for real.
- repeat:
    times: 20
    commands:
      - tapOn: { id: "exam-option-0" }
      - tapOn: { id: "exam-next" }
- extendedWaitUntil:
    visible: { id: "exam-review" }
    timeout: 15000
- tapOn: { id: "exam-submit" }

# 3d — results. Banded, with a score; correctness surfaces only now the paper is in.
- extendedWaitUntil:
    visible: { id: "exam-results" }
    timeout: 15000
- assertVisible: { id: "exam-total" }
- assertVisible: { id: "exam-band" }
- takeScreenshot: exam-results

# 8b — the marked script. Opens on the first lost mark, names the misconception, and
# "Next wrong" walks only the questions that cost something.
- tapOn: { id: "exam-review-paper" }
- extendedWaitUntil:
    visible: { id: "exam-marked" }
    timeout: 15000
- assertVisible: { id: "exam-review-strip" }
- assertVisible: { id: "exam-review-mark" }
- assertVisible: { id: "exam-review-why" }
- assertVisible: { id: "exam-review-revise" }
- takeScreenshot: exam-marked
- tapOn: { id: "exam-review-next-wrong" }
- assertVisible: { id: "exam-review-mark" }
- tapOn: { id: "exam-review-close" }
- assertVisible: { id: "exam-results" }

# 7e / G6 U9 — the result IS the next session's plan. The paper's own worst section
# is the primary action, and it leaves the Exams tab for that lane's detail in Learn.
# Only a device run proves the strand survives the tab change; jest sees the callback
# fire either way.
- assertVisible: { id: "exam-revise-worst" }
- tapOn: { id: "exam-revise-worst" }
- extendedWaitUntil:
    visible: { id: "lane-screen" }
    timeout: 20000
- assertVisible: { id: "lane-heading", text: "Terms & Signs" }
# ...at the grade the PAPER examined. The seeded state has terms depth 3, so without
# the grade being carried across this lands on grade 4 — a lane about material the
# paper never asked about, reached by failing a grade-1 section.
- assertVisible: { id: "lane-grade-label", text: "Grade 1.*" }
- takeScreenshot: exam-result-drill

# The drill is the result screen's PRIMARY action, so it must not cost the learner
# three of the four tabs. Clearing the exam grade and switching tab happen in one
# commit, which unmounts the Exams screen before its immersive effect can report
# false — and the tab bar then stays hidden until the app is restarted. Assert the
# way out is still there, and take it.
- assertVisible: { id: "tab-bar" }
- tapOn: { id: "tab-practice" }
- extendedWaitUntil:
    visible: { id: "tab-bar" }
    timeout: 15000
- takeScreenshot: exam-drill-tabs-survive
