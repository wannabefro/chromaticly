# fyu.3 / design 5c — free grade access. Proves the working grade is a
# self-service switch that actually re-renders on device (the react-compiler
# staleness class jest can't catch). G6 U7 re-navigated it: the level-map half of
# the claim now returns to the lane the seed opened. U8 removes the picker steps
# with the picker itself.
appId: host.exp.Exponent
---
- clearState
- openLink: exp://127.0.0.1:8090/--/?seed=transposition-3

- extendedWaitUntil:
    visible: { text: "Continue" }
    timeout: 40000
    optional: true
- tapOn: { text: "Continue", optional: true }
- tapOn: { point: "90%,48%" }

- extendedWaitUntil:
    visible: { id: "lane-screen" }
    timeout: 90000

# --- Profile working-grade switch (design 5c) ---
- tapOn: { id: "tab-profile" }
- assertVisible: { id: "profile-screen" }
- scrollUntilVisible:
    element: { id: "profile-working-grade" }
    direction: DOWN
    timeout: 15000
- takeScreenshot: grade-switch-profile-before
- tapOn: { id: "profile-working-grade" }
- assertVisible: { id: "profile-working-grade-picker" }
# Switch to Grade 2 (from the seeded Grade 3) — proves the switch re-renders.
# Selecting an option collapses the picker and switches the working grade. The
# picker closing (setGradePickerOpen(false) fires only after `await setGrade`)
# proves the switch cycle completed and re-rendered — the react-compiler
# staleness class this gate exists to catch. The new grade VALUE (pill 2
# highlighted, "Grade 2" in the working-grade row) is captured by the screenshot
# for a human eye, per the repo's convention for visual state Maestro can't
# assert as a single text node.
- tapOn: { id: "profile-working-grade-option-2" }
- assertNotVisible: { id: "profile-working-grade-picker" }
- assertVisible: { id: "profile-working-grade" }
- takeScreenshot: grade-switch-profile-after

# --- Learn is still there and still on its lane after the switch ---
- tapOn: { id: "tab-learn" }
- extendedWaitUntil:
    visible: { id: "lane-screen" }
    timeout: 20000
- takeScreenshot: grade-switch-lane
