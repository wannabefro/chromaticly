# AE3 — key-signatures MCQ. The options are staves or key names, depending on
# the direction drawn. This flow proves the option is tappable on a device.
#
# Seeded straight to the unit (?seed=<unitId>) — see .maestro/README.md.
appId: host.exp.Exponent
---
- clearState
- openLink: ${DEV_URL}/--/?seed=key-signatures

# Expo Go shows its dev-menu sheet on a cold launch: dismiss the intro, then close
# the menu via its X (top-right of the sheet).
- extendedWaitUntil:
    visible: { text: "Continue" }
    timeout: 40000
    optional: true
- tapOn: { text: "Continue", optional: true }

- extendedWaitUntil:
    visible: { id: "lane-screen" }
    timeout: 90000
- scrollUntilVisible:
    element: { id: "unit-row-key-signatures" }
    direction: DOWN
    timeout: 15000
- tapOn: { id: "unit-row-key-signatures" }

# Every lesson opens on the teach phase (302.3); the CTA starts the set.
- extendedWaitUntil:
    visible: { id: "teach-phase" }
    timeout: 20000
- tapOn: { id: "teach-start" }

- extendedWaitUntil:
    visible: { id: "mcq" }
    timeout: 20000
- assertVisible: { id: "set-count" }
- assertVisible: { id: "option-0" }

# Rendered staves push the options off the bottom, so Check is a sticky footer.
- tapOn: { id: "option-0" }
- assertVisible: { id: "check" }
- tapOn: { id: "check" }
- extendedWaitUntil:
    visible: { id: "feedback-sheet" }
    timeout: 10000
- tapOn: { id: "feedback-sheet-continue" }

# The set advances to the next item rather than getting stuck on the sheet.
- assertVisible: { id: "set-count" }
