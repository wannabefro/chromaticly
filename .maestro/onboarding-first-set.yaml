# First shippable slice, end to end: guest onboarding → complete the first 8-item
# set → mastery-gems payoff (2f), plus the under-13 soft-block. This is the DoD's
# outer loop, the layer the Jest tests mock (persistence, WebView notation, nav).
#
# Two passes in one flow, each begins with clearState so onboarding fires fresh:
#   1. Under-13 → soft-block, no path forward (never onboards).
#   2. New user → Welcome → birth-year 13+ → level map (3a) → tap first unit →
#      8 correct → 2f.
#
# The 8 items are pure functions of (grade 1, seed 0..7) fed by SetRunner, so
# the correct-option index is fixed: 0,0,2,1,0,0,2,2 (answers D,B,C,E,D,G,G,B).
# Regenerate both if the generator, the treble-notes atoms, or assembleOptions'
# shuffle changes. We tap by option INDEX (`option-<i>`), not by the note-name
# label: since treble-notes is atom-driven every option is a single natural
# letter, which collides with the A/B/C position badges on each row (a `^B$`
# regex matches the badge as readily as the value), so a label tap is ambiguous.
# Index taps are unambiguous.
#
# Prerequisite: Metro running, Chromaticly active in Expo Go (see README).
#   maestro test -e DEV_URL=exp://127.0.0.1:8090 .maestro/onboarding-first-set.yaml
appId: host.exp.Exponent
---
# ── Pass 1: under-13 soft-block ───────────────────────────────────────────────
- clearState
- openLink: ${DEV_URL}
- tapOn:
    text: "Open"
    optional: true
# clearState wipes Expo Go's own first-launch flag, so a fresh open shows its
# "developer menu": first an intro sheet (Continue), then the menu itself, which
# must be closed via its X (top-right) to reveal the app. Both no-op on a warm
# open (Continue not found; the point tap lands on empty Welcome space).
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    point: "90%,48%"
- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 60000

- tapOn:
    id: "start-learning"
- assertVisible:
    id: "age-gate-screen"

# Born 8 years ago → under 13. Scroll the year list to reach it, then continue.
- scrollUntilVisible:
    element:
      id: "year-2018"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "year-2018"
- tapOn:
    id: "age-continue"

# Soft-block, and no way back into onboarding (never onboards — R2, A11).
- assertVisible:
    id: "under13-block"
- assertNotVisible:
    id: "age-gate-screen"

# ── Pass 2: new user completes the first set ─────────────────────────────────
- clearState
- openLink: ${DEV_URL}
- tapOn:
    text: "Open"
    optional: true
# clearState wipes Expo Go's own first-launch flag, so a fresh open shows its
# "developer menu": first an intro sheet (Continue), then the menu itself, which
# must be closed via its X (top-right) to reveal the app. Both no-op on a warm
# open (Continue not found; the point tap lands on empty Welcome space).
- tapOn:
    text: "Continue"
    optional: true
- tapOn:
    point: "90%,48%"
- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 60000

- tapOn:
    id: "start-learning"
- assertVisible:
    id: "age-gate-screen"

# Born 20 years ago → 13+. Continue onboards and lands on the level map (3a).
- scrollUntilVisible:
    element:
      id: "year-2006"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "year-2006"
- tapOn:
    id: "age-continue"

- extendedWaitUntil:
    visible:
      id: "level-map-screen"
    timeout: 15000

# The exam-gate node is present and locked (display-only, AE2). On a fresh
# onboard the six locked units carry two-line "Finish … to unlock" subtitles, so
# the gate sits below the fold — scroll to prove it's there (layout-height-
# independent), then scroll back up to the first unit before starting it.
- scrollUntilVisible:
    element:
      id: "exam-gate-level-1"
    direction: DOWN
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "unit-row-treble-notes"
    direction: UP
    timeout: 15000

# Begin the first unit (treble-notes) from the level map.
- tapOn:
    id: "unit-row-treble-notes"
- assertVisible:
    id: "set-runner"

# 8 correct answers (seeds 0..7). Each item: pick the label → Check → Continue.
- tapOn:
    id: "option-0"
- tapOn:
    id: "check"
- tapOn:
    id: "feedback-sheet-continue"

- tapOn:
    id: "option-0"
- tapOn:
    id: "check"
- tapOn:
    id: "feedback-sheet-continue"

- tapOn:
    id: "option-2"
- tapOn:
    id: "check"
- tapOn:
    id: "feedback-sheet-continue"

- tapOn:
    id: "option-1"
- tapOn:
    id: "check"
- tapOn:
    id: "feedback-sheet-continue"

- tapOn:
    id: "option-0"
- tapOn:
    id: "check"
- tapOn:
    id: "feedback-sheet-continue"

- tapOn:
    id: "option-0"
- tapOn:
    id: "check"
- tapOn:
    id: "feedback-sheet-continue"

- tapOn:
    id: "option-2"
- tapOn:
    id: "check"
- tapOn:
    id: "feedback-sheet-continue"

- tapOn:
    id: "option-2"
- tapOn:
    id: "check"
- tapOn:
    id: "feedback-sheet-continue"

# 2f payoff: mastery gems + score ring 8/8.
- extendedWaitUntil:
    visible:
      id: "set-complete"
    timeout: 15000
- assertVisible:
    id: "set-gems"
- assertVisible: "8/8"
