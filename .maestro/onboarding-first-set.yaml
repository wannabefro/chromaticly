# First-run journey, end to end (design 7c + A1/A2): a fresh guest goes
# Welcome → placement → result → your plan → 3-question coached warm-up →
# landed → the seven-lane Learn tab (7a), then taps into the first real unit.
# This is the DoD's outer loop — the layer the Jest tests mock (persistence,
# WebView notation, navigation). There is NO age gate on this path (it moved to
# account creation), so the old under-13 soft-block pass is gone.
#
# Since U11 there is no grade pill to tap. Placement asks one question per
# placeable strand and seeds seven independent depths; correctness does not
# matter to this flow, which proves the ROUTE, not the measurement. Each item is
# answered by taking the first option — the depths that produces are whatever
# they are, and Jest owns what they should be.
#
# The 3 warm-up items are pure functions of `warmUpFor`, so their answers are
# fixed: 3/4, 2/4, 4/4. We tap by LABEL, not by index. Index was correct while
# the warm-up drilled `note_value_compare`, whose options are plain-language
# note-value phrases that collide with the A/B/C position badges. Since
# chromaticly-atz it drills `add_time_signature`, whose options are "3/4" and
# friends — unambiguous, and immune to a reshuffle of assembleOptions.
#
# Retry-until-correct loops a wrong item rather than failing the run, so a stale
# index does not fail here: it stalls on question 3 of 3 and reports a missing
# landed-screen 30 seconds later. A label cannot go stale that way.
#
# Prerequisite: Metro running, Chromaticly active in Expo Go (see README).
#   maestro test -e DEV_URL=exp://127.0.0.1:8090 .maestro/onboarding-first-set.yaml
appId: host.exp.Exponent
---
- clearState
- openLink: ${DEV_URL}
- runFlow: _dev-menu.yaml
- extendedWaitUntil:
    visible:
      id: "welcome-screen"
    timeout: 60000

# ── Step 1 → 2: Welcome → placement ──────────────────────────────────────────
- tapOn:
    id: "start-learning"
- assertVisible:
    id: "placement-intro"
- tapOn:
    id: "placement-start"
- assertVisible:
    id: "placement-item"

# ── Step 2: the mixed pass, one item per placeable strand ────────────────────
# Seven repeats, one per strand. `optional: true` on each tap absorbs the two
# non-MCQ shapes the bank serves — the context passage's bar taps and the chord
# numeral chips — so the flow does not need to know which strand came up.
- repeat:
    times: 7
    commands:
      - tapOn: { id: "option-0", optional: true }
      - tapOn: { id: "bar-1", optional: true }
      - tapOn: { id: "roman-numeral-I", optional: true }
      - tapOn: { id: "check" }
      - tapOn: { id: "feedback-sheet-continue" }

# ── Step 2 → 3: the seven depths, then the plan ──────────────────────────────
- extendedWaitUntil:
    visible:
      id: "placement-result"
    timeout: 15000
- tapOn:
    id: "placement-accept"
- assertVisible:
    id: "plan-screen"

# ── Step 3 → 4: your plan → coached warm-up ──────────────────────────────────
- tapOn:
    id: "plan-start-warmup"
- assertVisible:
    id: "warm-up-screen"

# The three coached questions, answered by LABEL (see the header note).
- tapOn:
    text: "3/4"
- tapOn:
    id: "check"
- tapOn:
    id: "feedback-sheet-continue"

- tapOn:
    text: "2/4"
- tapOn:
    id: "check"
- tapOn:
    id: "feedback-sheet-continue"

- tapOn:
    text: "4/4"
- tapOn:
    id: "check"
- tapOn:
    id: "feedback-sheet-continue"

# ── Step 6: landed → the Learn tab ───────────────────────────────────────────
- extendedWaitUntil:
    visible:
      id: "landed-screen"
    timeout: 15000
- assertVisible:
    text: "You're in. 3 for 3."
- tapOn:
    id: "landed-continue"

# The onboarding persisted → we fall through to the seven-lane Learn tab (7a).
- extendedWaitUntil:
    visible:
      id: "lanes-screen"
    timeout: 15000

# treble-notes is a PITCH unit, so it lives one tap down, in the pitch lane. With
# nothing mastered the lane opens at its first content-bearing grade, which is
# where treble-notes is.
- tapOn:
    id: "lane-row-pitch"
- extendedWaitUntil:
    visible:
      id: "lane-screen"
    timeout: 15000

# The first real unit is live and enters its set — "the full lesson picks up
# right here". Prove the hand-off, then stop (the 8-item set is Jest-covered).
- tapOn:
    id: "unit-row-treble-notes"
- assertVisible:
    id: "set-runner"
