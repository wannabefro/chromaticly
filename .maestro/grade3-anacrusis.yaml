# Grade 3 anacrusis, anacrusis_recognition MCQ (chromaticly-1v5.3). Seeds
# ?seed=anacrusis-3. Its point is the NOTATION: a partial (upbeat) pickup bar
# rendered on the light --paper card, with a complementary short final bar —
# abcjs behaviour no jest test can verify (plan Risk: "abcjs pickup rendering").
# `anacrusis-3` is the new Grade 3 terminal, so seeding auto-scrolls the map to
# it and reaching `unit-row-anacrusis-3` is itself the Level 3 unlock proof.
appId: host.exp.Exponent
---
- clearState
- openLink: ${DEV_URL}/--/?seed=anacrusis-3

- runFlow: _dev-menu.yaml

- extendedWaitUntil:
    visible: { id: "lane-screen" }
    timeout: 90000

# Seeding auto-scrolls the map to the target (last) unit, so unit-row-anacrusis-3
# is already near view — no level-node scroll (it would land past the level-3
# header). Reaching the unit row is itself the Level 3 unlock proof.
- scrollUntilVisible:
    element: { id: "unit-row-anacrusis-3" }
    direction: DOWN
    visibilityPercentage: 20
    centerElement: true
    waitToSettleTimeoutMs: 500
    timeout: 20000
- tapOn: { id: "unit-row-anacrusis-3" }

- extendedWaitUntil:
    visible: { id: "teach-phase" }
    timeout: 20000
- takeScreenshot: g3-anacrusis-teach
- tapOn: { id: "teach-start" }

- extendedWaitUntil:
    visible: { id: "mcq" }
    timeout: 20000
- assertVisible: { id: "set-count" }
- assertVisible: { id: "option-0" }
- takeScreenshot: g3-anacrusis-mcq

- tapOn: { id: "option-0" }
- assertVisible: { id: "check" }
- tapOn: { id: "check" }
- extendedWaitUntil:
    visible: { id: "feedback-sheet" }
    timeout: 10000
- takeScreenshot: g3-anacrusis-feedback
- tapOn: { id: "feedback-sheet-continue" }
- assertVisible: { id: "set-count" }
