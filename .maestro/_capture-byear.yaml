# Screenshots the by-ear card, which is the LAST item of a wired lesson's set —
# so the eight written items are answered blindly first to reach it. The deep
# link is opened by simctl before maestro runs; see scripts/capture-lesson.sh.
appId: host.exp.Exponent
---
- extendedWaitUntil:
    visible: { text: "Continue" }
    timeout: 30000
    optional: true
- tapOn: { text: "Continue", optional: true }
- tapOn: { point: "90%,48%", optional: true }

- extendedWaitUntil:
    visible: { id: "lane-screen" }
    timeout: 60000
    optional: true
- tapOn: { text: "Continue", optional: true }

- tapOn: { id: "set-close", optional: true }
- tapOn: { id: "teach-close", optional: true }
- extendedWaitUntil:
    visible: { id: "lane-screen" }
    timeout: 60000

# The picker TOGGLES, and the blind dev-overlay tap above can already have
# opened it, so tapping unconditionally closed it again (chromaticly-9ys).
- runFlow:
    when:
      notVisible: { id: "lane-grade-option-${GRADE}" }
    commands:
      - tapOn: { id: "lane-other-grades", optional: true }
- extendedWaitUntil:
    visible: { id: "lane-grade-option-${GRADE}" }
    timeout: 10000
    optional: true
- tapOn: { id: "lane-grade-option-${GRADE}", optional: true }
- scrollUntilVisible:
    element: { id: "unit-row-${LESSON}" }
    direction: DOWN
    visibilityPercentage: 20
    centerElement: true
    waitToSettleTimeoutMs: 500
    timeout: 45000
- tapOn: { id: "unit-row-${LESSON}" }

- extendedWaitUntil:
    visible: { id: "teach-phase" }
    timeout: 20000
- tapOn: { id: "teach-start" }

- extendedWaitUntil:
    visible: { id: "prompt" }
    timeout: 20000

# Answer the eight written items blindly — right or wrong does not matter here,
# reaching the tail does.
- repeat:
    times: 8
    commands:
      - tapOn: { id: "option-0", optional: true }
      - tapOn: { id: "check", optional: true }
      - tapOn: { id: "feedback-sheet-continue", optional: true }

- extendedWaitUntil:
    visible: { id: "by-ear-match" }
    timeout: 20000
- extendedWaitUntil:
    visible: { id: "__settle_never__" }
    timeout: 4500
    optional: true
- takeScreenshot: ${OUT}/${LESSON}-byear-1-card

- tapOn: { id: "by-ear-listen" }
- takeScreenshot: ${OUT}/${LESSON}-byear-2-listened

# Check stays dead until a note is tapped. Shots 3 and 4 are AE3.
- tapOn: { id: "by-ear-verdict-different" }
- takeScreenshot: ${OUT}/${LESSON}-byear-3-where

- tapOn: { id: "by-ear-position-1", optional: true }
- takeScreenshot: ${OUT}/${LESSON}-byear-4-answered

- tapOn: { id: "check", optional: true }
- extendedWaitUntil:
    visible: { id: "__settle_never__" }
    timeout: 3000
    optional: true
- takeScreenshot: ${OUT}/${LESSON}-byear-5-feedback
