# fyu.9 — Grade 4 alto clef. Seeds ?seed=alto-reading-4 (reading the alto/C
# clef). The on-device proof jest can't give: that the notation surface RENDERS
# the alto clef (K: clef=alto) with its middle line as middle C. Reaching
# unit-row-alto-reading-4 proves the grade-4 chain extends through the alto
# reading + transposition lessons. Runs once at U13, once Level 4 is reachable
# (level4() real) — see the fyu.13 notes on on-device gate consolidation.
appId: host.exp.Exponent
---
- clearState
- openLink: ${DEV_URL}/--/?seed=alto-reading-4

- extendedWaitUntil:
    visible: { text: "Continue" }
    timeout: 40000
    optional: true
- tapOn: { text: "Continue", optional: true }
- tapOn: { point: "90%,48%" }

- extendedWaitUntil:
    visible: { id: "lane-screen" }
    timeout: 90000

- scrollUntilVisible:
    element: { id: "unit-row-alto-reading-4" }
    direction: DOWN
    visibilityPercentage: 20
    centerElement: true
    waitToSettleTimeoutMs: 500
    timeout: 20000
- tapOn: { id: "unit-row-alto-reading-4" }

- extendedWaitUntil:
    visible: { id: "teach-phase" }
    timeout: 20000
- takeScreenshot: g4-alto-teach
- tapOn: { id: "teach-start" }

# The exercise renders a note on the ALTO clef paper card.
- extendedWaitUntil:
    visible: { id: "stimulus-music" }
    timeout: 20000
- assertVisible: { id: "stimulus-music" }
- takeScreenshot: g4-alto-exercise
