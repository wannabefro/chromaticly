# Nothing is hard-locked (G6 U3, R2): every unit is reachable regardless of what
# came before it. This flow used to assert the opposite — that bass-notes rendered
# locked until treble-notes was finished — so it is rewritten rather than retired:
# it now guards the behaviour that REPLACED the gate.
#
# G6 U7 re-navigates it. The level map is gone, so "scroll down the one big list"
# becomes "open a lane, and for a grade you have not reached, choose it" — which is
# the same claim in the new shape: nothing refuses entry, at any depth, in any lane.
#
# Why on device rather than in jest: the lane screen derives its rows from the
# in-place-mutated store, which is a React Compiler staleness hazard, and jest's
# layout-free renderer will happily find a row that is invisible or unreachable on
# a real screen. Only an on-device run proves a learner can actually get there.
#
# Seeds to treble-notes (the chain root) purely to skip onboarding: it completes
# NOTHING and masters NOTHING, so every lane reads depth 0 and every unit after it
# — including every grade-2 unit — has an unfinished predecessor chain. That is
# exactly the state the old gate would have blocked.
#
# Prerequisite: Metro running, Chromaticly active in Expo Go (see README).
appId: host.exp.Exponent
---
- clearState
- openLink: exp://127.0.0.1:8090/--/?seed=treble-notes

- extendedWaitUntil:
    visible: { text: "Continue" }
    timeout: 40000
    optional: true
- tapOn: { text: "Continue", optional: true }
- tapOn: { point: "90%,48%" }

# The seed names a pitch lesson, so the deep link lands on the pitch lane.
- extendedWaitUntil:
    visible: { id: "lane-screen" }
    timeout: 90000

# No locked affordance: no padlock, and no row telling the learner to finish
# something else first.
- assertNotVisible: { text: "🔒" }
- assertNotVisible: { text: "to unlock" }
- takeScreenshot: nothing-locked-lane

# A DIFFERENT lane, with nothing done in it at all, is enterable — under the old
# rules its units sat behind an unfinished grade-1 chain.
- tapOn: { id: "lane-back" }
- extendedWaitUntil:
    visible: { id: "lanes-screen" }
    timeout: 20000
- tapOn: { id: "lane-row-intervals" }
- extendedWaitUntil:
    visible: { id: "unit-row-intervals" }
    timeout: 20000
- tapOn: { id: "unit-row-intervals" }
- extendedWaitUntil:
    visible: { id: "teach-phase" }
    timeout: 20000
- takeScreenshot: other-lane-unit-open
# `teach-close`, not a `back` gesture: the teach phase is a screen-level view, not
# a pushed route, so a swipe-back finds nothing to pop.
- tapOn: { id: "teach-close" }

# The stronger claim: a LATER-GRADE unit is reachable too, with grade 1 neither
# mastered nor its exam cleared. The picker is the whole of that navigation — it
# lists every grade, and choosing one above your depth is never refused (R2).
- extendedWaitUntil:
    visible: { id: "lane-screen" }
    timeout: 20000
- tapOn: { id: "lane-back" }
- tapOn: { id: "lane-row-scales_keys" }
- extendedWaitUntil:
    visible: { id: "lane-screen" }
    timeout: 20000
# The picker toggles and may already be open (chromaticly-9ys).
- runFlow:
    when:
      notVisible: { id: "lane-grade-picker" }
    commands:
      - tapOn: { id: "lane-other-grades" }
- extendedWaitUntil:
    visible: { id: "lane-grade-picker" }
    timeout: 10000
- takeScreenshot: grade-picker-open
- tapOn: { id: "lane-grade-option-2" }

# Above your depth the screen says so and offers the way back — it does not
# withdraw entry.
- extendedWaitUntil:
    visible: { id: "lane-ahead-note" }
    timeout: 15000
- assertVisible: { id: "lane-return" }
- takeScreenshot: later-grade-reachable
- tapOn: { id: "unit-row-key-signatures-2" }
- extendedWaitUntil:
    visible: { id: "teach-phase" }
    timeout: 20000
