# Nothing is hard-locked (G6 U3, R2): every unit is reachable regardless of what
# came before it. This flow used to assert the opposite — that bass-notes rendered
# locked until treble-notes was finished — so it is rewritten rather than retired:
# it now guards the behaviour that REPLACED the gate.
#
# Why on device rather than in jest: the level map derives its rows from the
# in-place-mutated store, which is a React Compiler staleness hazard, and jest's
# layout-free renderer will happily find a row that is invisible or unreachable on
# a real screen. Only an on-device run proves a learner can actually get there.
#
# Seeds to treble-notes (the chain root) purely to skip onboarding: it completes
# NOTHING, so every unit after it — including every grade-2 unit — has an unfinished
# predecessor chain. That is exactly the state the old gate would have blocked.
#
# Prerequisite: Metro running, Chromaticly active in Expo Go (see README).
appId: host.exp.Exponent
---
- clearState
- openLink: exp://127.0.0.1:8090/--/?seed=treble-notes

- extendedWaitUntil:
    visible: { text: "Continue" }
    timeout: 40000
    optional: true
- tapOn: { text: "Continue", optional: true }
- tapOn: { point: "90%,48%" }

- extendedWaitUntil:
    visible: { id: "level-map-screen" }
    timeout: 90000

# No locked affordance anywhere on the map: no padlock, and no row telling the
# learner to finish something else first.
- assertNotVisible: { text: "🔒" }
- assertNotVisible: { text: "to unlock" }
- takeScreenshot: nothing-locked-map

# A unit several steps down the grade-1 chain, with every predecessor unfinished,
# is enterable — a locked row was disabled and would never reach its teach phase.
- scrollUntilVisible:
    element: { id: "unit-row-intervals" }
    direction: DOWN
    timeout: 15000
- tapOn: { id: "unit-row-intervals" }
- extendedWaitUntil:
    visible: { id: "teach-phase" }
    timeout: 20000
- takeScreenshot: mid-chain-unit-open
# `teach-close`, not a `back` gesture: the teach phase is a screen-level view
# inside the map, not a pushed route, so a swipe-back finds nothing to pop.
- tapOn: { id: "teach-close" }

# The stronger claim: a LATER-GRADE unit is reachable too, with grade 1 neither
# mastered nor its exam cleared. Under the old rules Level 2 rendered collapsed
# with no unit row at all, so reaching this teach phase is the proof.
- extendedWaitUntil:
    visible: { id: "level-map-screen" }
    timeout: 20000
# Straight to the grade-2 unit row. Not via `level-node-level-2`: with grade 2
# fully authored that node is taller than the viewport, so it can never satisfy
# the default 100% visibility and the scroll times out on an element that is
# plainly on screen.
- scrollUntilVisible:
    element: { id: "unit-row-key-signatures-2" }
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 60
- takeScreenshot: later-grade-reachable
- tapOn: { id: "unit-row-key-signatures-2" }
- extendedWaitUntil:
    visible: { id: "teach-phase" }
    timeout: 20000
