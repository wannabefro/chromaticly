# fyu.10 — Grade 4 chords (first harmony content). Seed ?seed=chords-4
# (recognition of primary triads I/IV/V in a major key). Reaching
# unit-row-chords-4 proves the grade-4 chain extends through the chords lesson;
# the exercise renders a root-position triad on the paper card with the
# RomanNumeralBoxes interaction (numeral chips, letter-name labels beneath).
# Runs once at U13, once Level 4 is reachable (level4() real) — see the fyu.13
# notes on on-device gate consolidation.
appId: host.exp.Exponent
---
- clearState
- openLink: ${DEV_URL}/--/?seed=chords-4

- extendedWaitUntil:
    visible: { text: "Continue" }
    timeout: 40000
    optional: true
- tapOn: { text: "Continue", optional: true }
- tapOn: { point: "90%,48%" }

- extendedWaitUntil:
    visible: { id: "level-map-screen" }
    timeout: 90000

- scrollUntilVisible:
    element: { id: "unit-row-chords-4" }
    direction: DOWN
    visibilityPercentage: 20
    centerElement: true
    waitToSettleTimeoutMs: 500
    timeout: 20000
- tapOn: { id: "unit-row-chords-4" }

- extendedWaitUntil:
    visible: { id: "teach-phase" }
    timeout: 20000
- takeScreenshot: g4-chords-teach
- tapOn: { id: "teach-start" }

- extendedWaitUntil:
    visible: { id: "stimulus-music" }
    timeout: 20000
- assertVisible: { id: "stimulus-music" }
- assertVisible: { id: "roman-numeral-boxes" }
- takeScreenshot: g4-chords-exercise
