# Replaying a lesson must NOT give the same eight questions (pedagogy audit,
# 2026-07-29). Set seeds are `itemIndex + SET_SIZE * plays`, and `plays` is read
# through a useMemo over the mutable ProgressStore — the React Compiler staleness
# class that jest's layout-free renderer cannot catch. A stale read pins every
# learner to offset 0 forever and looks completely fine in the suite.
#
# The proof is two screenshots of item 1: once on a fresh store, once after the
# set has been completed. They must differ. Correctness of the answers is not the
# point here and is Jest-covered, so the flow taps option-0 blindly.
#
# It drills `key-signatures` rather than `treble-notes` because a blind option-0
# tap needs a set that is MCQ all the way through. `treble-notes` mixes mcq with
# stave_input, which has no `option-0` at all, so the walk died on item 2 of 8.
# `key-signatures` is 8 items, every one an mcq, and no by-ear tail — so `repeat:
# 8` finishes the set exactly. Its item 1 moves G major -> D major between plays,
# which is the difference the two screenshots have to show.
#
# Prerequisite: Metro running, Chromaticly active in Expo Go (see README).
appId: host.exp.Exponent
---
- clearState
- openLink: ${DEV_URL}/--/?seed=key-signatures

- runFlow: _dev-menu.yaml

- extendedWaitUntil:
    visible: { id: "lane-screen" }
    timeout: 90000
- scrollUntilVisible:
    element: { id: "unit-row-key-signatures" }
    direction: DOWN
    visibilityPercentage: 20
    centerElement: true
    waitToSettleTimeoutMs: 500
    timeout: 20000
- tapOn: { id: "unit-row-key-signatures" }
- extendedWaitUntil:
    visible: { id: "teach-phase" }
    timeout: 20000
- tapOn: { id: "teach-start" }

# First play, item 1 — seed 0.
- extendedWaitUntil:
    visible: { id: "set-count" }
    timeout: 20000
- takeScreenshot: seed-play1-item1

# Walk the whole set. Right or wrong does not matter; finishing is what advances
# `plays`, and only a FINISHED set counts.
- repeat:
    times: 8
    commands:
      - tapOn: { id: "option-0" }
      - tapOn: { id: "check" }
      - tapOn: { id: "feedback-sheet-continue" }

- extendedWaitUntil:
    visible: { id: "set-complete" }
    timeout: 20000

# `key-signatures` has 10 completed predecessors, so this set is the third-lesson
# transition the account nudge (6c) keys on, and it overlays the complete screen.
# Dismiss it BEFORE `set-next`, or the overlay swallows that tap. Optional: the
# nudge is one-time, so the second play never sees it.
- tapOn: { id: "account-nudge-sheet-dismiss", optional: true }

- takeScreenshot: seed-set-complete
- tapOn: { id: "set-next" }

# Second play, item 1 — must now be seed 8, i.e. a DIFFERENT question.
- extendedWaitUntil:
    visible: { id: "lane-screen" }
    timeout: 20000
- scrollUntilVisible:
    element: { id: "unit-row-key-signatures" }
    direction: DOWN
    visibilityPercentage: 20
    centerElement: true
    waitToSettleTimeoutMs: 500
    timeout: 20000
- tapOn: { id: "unit-row-key-signatures" }
- extendedWaitUntil:
    visible: { id: "teach-phase" }
    timeout: 20000
- tapOn: { id: "teach-start" }
- extendedWaitUntil:
    visible: { id: "set-count" }
    timeout: 20000
- takeScreenshot: seed-play2-item1
